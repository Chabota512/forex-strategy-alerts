kind = "data-app"
previewPath = "/"
title = "myFXtool"
description = "An interactive foreign-exchange rate chart for comparing official historical currency rates across adjustable date ranges, using public central-bank data."
version = "1.0.0"
id = "artifacts/myfxtool"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19588

[services.development]
run = "pnpm --filter @workspace/myfxtool run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/myfxtool", "run", "build" ]
serve = "static"
publicDir = "artifacts/myfxtool/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19588"
BASE_PATH = "/"
