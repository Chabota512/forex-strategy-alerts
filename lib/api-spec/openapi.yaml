openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Forex Strategy Lab read-only data and unscored review operations
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: lab
    description: Real XAUUSD research data and unscored smoke review
  - name: evolve
    description: Owner-gated single-round strategy evolution
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /lab/dataset:
    get:
      operationId: getLabDataset
      tags: [lab]
      summary: Get local dataset metadata and owner review status
      parameters:
        - name: symbol
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/InstrumentSymbol"
            default: XAUUSD
      responses:
        "200":
          description: Dataset details, instrument review status, and review timeframes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatasetInfo"
  /lab/candles:
    get:
      operationId: getLabCandles
      tags: [lab]
      summary: Read a bounded candle window or one monthly chunk
      parameters:
        - name: symbol
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/InstrumentSymbol"
            default: XAUUSD
        - name: timeframe
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/Timeframe"
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100000
            default: 100000
        - name: chunkMonth
          in: query
          required: false
          description: Return only this UTC calendar month while including the full selected-window index metadata.
          schema:
            type: string
            pattern: "^\\d{4}-(0[1-9]|1[0-2])$"
      responses:
        "200":
          description: Candle window, with an explicit truncation indicator
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CandleWindow"
        "400":
          description: Invalid timeframe or date window
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /lab/backtest:
    post:
      operationId: runLabBacktest
      tags: [lab]
      summary: Run an unscored smoke backtest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BacktestInput"
      responses:
        "200":
          description: Candles and informational alerts from the frozen engine
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BacktestResult"
        "400":
          description: Invalid request or empty date window
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: Requested window exceeds the review cap
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /lab/replay/sessions:
    post:
      operationId: startLabReplaySession
      tags: [lab]
      summary: Start a paused incremental replay session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplaySessionStartInput"
      responses:
        "201":
          description: Session initialized at candle zero
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplaySessionStartResult"
        "400":
          description: Invalid or empty replay window
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /lab/replay/sessions/{sessionId}/advance:
    post:
      operationId: advanceLabReplaySession
      tags: [lab]
      summary: Process the next uncached replay candles up to an index
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplayAdvanceInput"
      responses:
        "200":
          description: New alerts, newly calculated states, and cached visible states
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplayAdvanceResult"
        "400":
          description: Invalid replay or visible-window index
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Replay session not found or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /lab/trades/comment:
    post:
      operationId: getTradeComment
      tags: [lab]
      summary: Generate or retrieve an objective journal comment for a simulated trade
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TradeCommentInput"
      responses:
        "200":
          description: Cached comment, generated comment, or graceful unavailable state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TradeCommentResult"
  /lab/alerts/comment:
    post:
      operationId: getAlertComment
      tags: [lab]
      summary: Generate or retrieve an objective alert journal comment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AlertCommentInput"
      responses:
        "200":
          description: Cached comment, generated comment, or graceful unavailable state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AICommentResult"
  /evolve/run:
    post:
      operationId: runEvolveRound
      tags: [evolve]
      summary: Start one background evolution round
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvolveRunInput"
      responses:
        "202":
          description: Evolution job accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvolveJobStatus"
        "409":
          description: Another evolution job is still running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /evolve/history:
    get:
      operationId: getEvolveHistory
      tags: [evolve]
      summary: List archived evolution round results
      responses:
        "200":
          description: Archived evolution results, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvolveRoundHistory"
  /evolve/policy:
    get:
      operationId: getEvolvePolicy
      tags: [evolve]
      summary: Get the current owner-promoted alert policy
      responses:
        "200":
          description: Current versioned alert policy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvolvePolicy"
  /evolve/status/{job_id}:
    get:
      operationId: getEvolveStatus
      tags: [evolve]
      summary: Poll an evolution job and its live log
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Current job state, logs, and round result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvolveJobStatus"
        "404":
          description: Evolution job not found in this server process
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /evolve/decide:
    post:
      operationId: decideEvolveJob
      tags: [evolve]
      summary: Promote or reject an eligible candidate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvolveDecisionInput"
      responses:
        "202":
          description: Owner decision accepted and round finalization resumed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvolveJobStatus"
        "400":
          description: Invalid decision input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Evolution job not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Job is not awaiting an owner decision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Timeframe:
      type: string
      enum: [M1, M5, M15, H1, H4, D1]
    ReviewTimeframe:
      type: string
      enum: [M5, M15]
    EvolvePolicySettings:
      type: object
      properties:
        min_strength:
          type: string
          enum: [NONE, NEUTRAL, STRONG]
        require_wp_agree:
          type: boolean
        require_engulf:
          type: boolean
        variant_b:
          type: boolean
        timeframes:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ReviewTimeframe"
        exit_model:
          type: string
          enum: [swept_level_atr, candle_geometry]
        cooldown_candles:
          type: integer
          minimum: 0
          maximum: 48
      required:
        - min_strength
        - require_wp_agree
        - require_engulf
        - variant_b
        - timeframes
        - exit_model
        - cooldown_candles
    EvolvePolicy:
      type: object
      properties:
        schema_version:
          type: integer
          const: 1
        version:
          type: integer
          minimum: 1
        mode:
          type: string
          enum: [passthrough, active]
        settings:
          $ref: "#/components/schemas/EvolvePolicySettings"
        promoted_at_utc:
          type: ["string", "null"]
        source_champion_version:
          type: ["string", "null"]
      required:
        - schema_version
        - version
        - mode
        - settings
        - promoted_at_utc
        - source_champion_version
    Candle:
      type: object
      properties:
        time:
          type: string
          format: date-time
        open:
          type: number
        high:
          type: number
        low:
          type: number
        close:
          type: number
        cct:
          type: string
        cst:
          type: string
        dcState:
          type: string
          enum: [undefined, uptrend, downtrend]
        hierState:
          type: string
          enum: [undefined, uptrend, downtrend, transition]
        wickPressure:
          $ref: "#/components/schemas/WickPressure"
      required: [time, open, high, low, close]
    OwnerAttestedSanityMetrics:
      type: object
      properties:
        provenance:
          type: string
          enum: [owner_reported]
        levelCorrelation:
          type: number
        hourlyChangeCorrelation:
          type: number
        medianFuturesOverSpotOffsetUsd:
          type: number
        note:
          type: string
      required:
        - provenance
        - levelCorrelation
        - hourlyChangeCorrelation
        - medianFuturesOverSpotOffsetUsd
        - note
    InstrumentSymbol:
      type: string
      enum: [XAUUSD, GBPUSD, USDJPY, GBPJPY, AUDJPY]
    DatasetInfo:
      type: object
      properties:
        symbol:
          $ref: "#/components/schemas/InstrumentSymbol"
        source:
          type: string
        sourceSha256:
          type: string
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        candleCount:
          type: integer
        reviewStatus:
          type: string
        ownerApproved:
          type: boolean
        scoringEnabled:
          type: boolean
        simulationCost:
          type: number
        instrumentReviews:
          type: array
          items:
            $ref: "#/components/schemas/InstrumentReviewInfo"
        availableTimeframes:
          type: array
          items:
            $ref: "#/components/schemas/Timeframe"
        defaultReviewTimeframes:
          type: array
          items:
            $ref: "#/components/schemas/ReviewTimeframe"
        m1ReviewNotice:
          type: string
        ownerAttestedSanityMetrics:
          $ref: "#/components/schemas/OwnerAttestedSanityMetrics"
      required:
        - symbol
        - source
        - sourceSha256
        - startDate
        - endDate
        - candleCount
        - reviewStatus
        - ownerApproved
        - scoringEnabled
        - simulationCost
        - instrumentReviews
        - availableTimeframes
        - defaultReviewTimeframes
        - m1ReviewNotice
        - ownerAttestedSanityMetrics
    InstrumentReviewInfo:
      type: object
      properties:
        symbol:
          type: string
        status:
          type: string
        ownerApproved:
          type: boolean
        dataAvailable:
          type: boolean
        dataComplete:
          type: boolean
        requiredYears:
          type: array
          items:
            type: integer
        availableYears:
          type: array
          items:
            type: integer
        rowCount:
          type: integer
          minimum: 0
        startDate:
          type: [string, "null"]
          format: date
        endDate:
          type: [string, "null"]
          format: date
      required:
        - symbol
        - status
        - ownerApproved
        - dataAvailable
        - dataComplete
        - requiredYears
        - availableYears
        - rowCount
        - startDate
        - endDate
    CandleMonthChunk:
      type: object
      properties:
        month:
          type: string
          pattern: "^\\d{4}-(0[1-9]|1[0-2])$"
        startIndex:
          type: integer
          minimum: 0
        count:
          type: integer
          minimum: 1
      required:
        - month
        - startIndex
        - count
    CandleWindow:
      type: object
      properties:
        symbol:
          $ref: "#/components/schemas/InstrumentSymbol"
        timeframe:
          $ref: "#/components/schemas/Timeframe"
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        candles:
          type: array
          items:
            $ref: "#/components/schemas/Candle"
        swingEvents:
          type: array
          items:
            $ref: "#/components/schemas/ConfirmedSwingEvent"
        totalCandles:
          type: integer
        limit:
          type: integer
        truncated:
          type: boolean
        chunks:
          type: array
          items:
            $ref: "#/components/schemas/CandleMonthChunk"
        chunkMonth:
          type: string
          nullable: true
        chunkOffset:
          type: integer
          minimum: 0
        source:
          type: string
        sourceSha256:
          type: string
      required:
        - symbol
        - timeframe
        - from
        - to
        - candles
        - swingEvents
        - totalCandles
        - limit
        - truncated
        - chunks
        - chunkMonth
        - chunkOffset
        - source
        - sourceSha256
    BacktestInput:
      type: object
      properties:
        symbol:
          $ref: "#/components/schemas/InstrumentSymbol"
        timeframe:
          $ref: "#/components/schemas/Timeframe"
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        simulationSettings:
          $ref: "#/components/schemas/SimulationSettings"
        simulationFilters:
          $ref: "#/components/schemas/SimulationFilters"
      required: [timeframe, from, to]
    ReplaySessionStartInput:
      type: object
      properties:
        symbol:
          $ref: "#/components/schemas/InstrumentSymbol"
        timeframe:
          $ref: "#/components/schemas/Timeframe"
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        variant_b:
          type: boolean
          default: false
          description: Include same-color sweep alerts in this replay session.
        simulationSettings:
          $ref: "#/components/schemas/SimulationSettings"
      required: [timeframe, from, to]
    SimulationSettings:
      type: object
      properties:
        enabled:
          type: boolean
          default: true
        startingBalance:
          type: number
          exclusiveMinimum: 0
          maximum: 1000000000000
          default: 10000
        riskPercent:
          type: number
          exclusiveMinimum: 0
          maximum: 100
          default: 1
          description: Percent of current realized balance risked by each trade.
        sizingMode:
          type: string
          enum: [LOTS, RISK_PERCENT]
          default: RISK_PERCENT
          description: Use fixed lot size or percent-risk position sizing.
        lotSize:
          type: number
          exclusiveMinimum: 0
          maximum: 1000000
          default: 0.01
          description: Fixed lot size used when sizingMode is LOTS.
        rewardMultiple:
          type: number
          exclusiveMinimum: 0
          maximum: 100
          default: 2
        stopBodyWeight:
          type: number
          exclusiveMinimum: 0
          default: 1
          description: Candle-geometry weight applied to the alert-candle body.
        stopWickMultiplier:
          type: number
          exclusiveMinimum: 0
          default: 2
          description: Candle-geometry multiplier applied to the sweep-side wick.
        targetRangeMultiplier:
          type: number
          exclusiveMinimum: 0
          default: 3
          description: Candle-geometry multiplier applied to the alert-candle range.
        exitModel:
          type: string
          enum: [swept_level_atr, candle_geometry]
          default: swept_level_atr
          description: Candle geometry uses the configured body and sweep-wick stop weights and alert-candle range target; rewardMultiple applies only to swept_level_atr.
      required: [enabled, startingBalance, riskPercent, sizingMode, lotSize, rewardMultiple, stopBodyWeight, stopWickMultiplier, targetRangeMultiplier, exitModel]
    SimulationFilters:
      type: object
      properties:
        direction:
          type: string
          enum: [ALL, BUY, SELL]
          default: ALL
        strength:
          type: string
          enum: [ALL, STRONG, NEUTRAL, WEAK]
          default: ALL
        engulfingOnly:
          type: boolean
          default: false
      required: [direction, strength, engulfingOnly]
    ReplayCandleState:
      type: object
      properties:
        index:
          type: integer
          minimum: 0
        cct:
          type: string
        cst:
          type: string
        dcState:
          type: string
          enum: [undefined, uptrend, downtrend]
        hierState:
          type: string
          enum: [undefined, uptrend, downtrend, transition]
      required: [index, cct, cst, dcState, hierState]
    WickPressure:
      type: string
      enum: [up-pressure, balanced, down-pressure]
    WickPressurePoint:
      type: object
      properties:
        index:
          type: integer
          minimum: 0
        state:
          $ref: "#/components/schemas/WickPressure"
      required: [index, state]
    ConfirmedSwingEvent:
      type: object
      properties:
        type:
          type: string
          enum: [swing_high, swing_low]
        pivot_time:
          type: string
          format: date-time
        confirmed_time:
          type: string
          format: date-time
        price:
          type: number
        source:
          type: string
          enum: [cct_minor, cst_major, dc, hier]
        pivot_index:
          type: integer
          minimum: 0
        confirmed_index:
          type: integer
          minimum: 0
        level:
          type: integer
          minimum: 1
          maximum: 3
      required: [type, pivot_time, confirmed_time, price, source, pivot_index, confirmed_index]
    ReplaySessionStartResult:
      type: object
      properties:
        sessionId:
          type: string
          format: uuid
        symbol:
          $ref: "#/components/schemas/InstrumentSymbol"
        runId:
          type: string
        timeframe:
          $ref: "#/components/schemas/Timeframe"
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        totalCandles:
          type: integer
        cursor:
          type: integer
          const: 0
        computedThrough:
          type: integer
          const: 0
        states:
          type: array
          items:
            $ref: "#/components/schemas/ReplayCandleState"
        wickPressureStates:
          type: array
          items:
            $ref: "#/components/schemas/WickPressurePoint"
        swingEvents:
          type: array
          items:
            $ref: "#/components/schemas/ConfirmedSwingEvent"
        simulation:
          $ref: "#/components/schemas/SimulationSnapshot"
        policyVersion:
          type: integer
          minimum: 1
        policySimulation:
          anyOf:
            - $ref: "#/components/schemas/SimulationSnapshot"
            - type: "null"
        policyTrades:
          type: array
          items:
            $ref: "#/components/schemas/SimulatedTrade"
        currentCandle:
          $ref: "#/components/schemas/Candle"
      required:
        - sessionId
        - symbol
        - runId
        - timeframe
        - from
        - to
        - totalCandles
        - cursor
        - computedThrough
        - states
        - wickPressureStates
        - swingEvents
        - simulation
        - policyVersion
        - policySimulation
        - policyTrades
        - currentCandle
    ReplayAdvanceInput:
      type: object
      properties:
        toIndex:
          type: integer
          minimum: 0
        viewStart:
          type: integer
          minimum: 0
        viewEnd:
          type: integer
          minimum: 0
        simulationFilters:
          $ref: "#/components/schemas/SimulationFilters"
      required: [toIndex, viewStart, viewEnd]
    ReplayAlert:
      type: object
      properties:
        candleIndex:
          type: integer
          minimum: 0
        alert:
          $ref: "#/components/schemas/Alert"
      required: [candleIndex, alert]
    ReplayPolicyDecision:
      type: object
      properties:
        alertId:
          type: string
        candleIndex:
          type: integer
          minimum: 0
        passed:
          type: boolean
        reasons:
          type: array
          items:
            type: string
      required: [alertId, candleIndex, passed, reasons]
    ReplayAdvanceResult:
      type: object
      properties:
        sessionId:
          type: string
          format: uuid
        runId:
          type: string
        timeframe:
          $ref: "#/components/schemas/Timeframe"
        cursor:
          type: integer
        requestedIndex:
          type: integer
        computedFrom:
          type: [integer, "null"]
        computedThrough:
          type: integer
        totalCandles:
          type: integer
        hasMore:
          type: boolean
        newStates:
          type: array
          items:
            $ref: "#/components/schemas/ReplayCandleState"
        visibleStates:
          type: array
          items:
            $ref: "#/components/schemas/ReplayCandleState"
        newWickPressureStates:
          type: array
          items:
            $ref: "#/components/schemas/WickPressurePoint"
        visibleWickPressureStates:
          type: array
          items:
            $ref: "#/components/schemas/WickPressurePoint"
        newSwingEvents:
          type: array
          items:
            $ref: "#/components/schemas/ConfirmedSwingEvent"
        newAlerts:
          type: array
          items:
            $ref: "#/components/schemas/ReplayAlert"
        policyVersion:
          type: integer
          minimum: 1
        policyDecisions:
          type: array
          items:
            $ref: "#/components/schemas/ReplayPolicyDecision"
        policySimulation:
          anyOf:
            - $ref: "#/components/schemas/SimulationSnapshot"
            - type: "null"
        policyTrades:
          type: array
          items:
            $ref: "#/components/schemas/SimulatedTrade"
        newlyOpenedTrades:
          type: array
          items:
            $ref: "#/components/schemas/SimulatedTrade"
        newlyResolvedTrades:
          type: array
          items:
            $ref: "#/components/schemas/SimulatedTrade"
        simulation:
          $ref: "#/components/schemas/SimulationSnapshot"
        currentCandle:
          $ref: "#/components/schemas/Candle"
        expiresInSeconds:
          type: integer
      required:
        - sessionId
        - runId
        - timeframe
        - cursor
        - requestedIndex
        - computedFrom
        - computedThrough
        - totalCandles
        - hasMore
        - newStates
        - visibleStates
        - newWickPressureStates
        - visibleWickPressureStates
        - policyVersion
        - policyDecisions
        - policySimulation
        - policyTrades
        - newSwingEvents
        - newAlerts
        - newlyOpenedTrades
        - newlyResolvedTrades
        - simulation
        - currentCandle
        - expiresInSeconds
    SimulatedTrade:
      type: object
      properties:
        tradeId:
          type: string
        alertId:
          type: string
        symbol:
          type: string
          enum: [GBPUSD, USDJPY, GBPJPY, AUDJPY, XAUUSD]
        direction:
          type: string
          enum: [BUY, SELL]
        alertType:
          type: string
          enum: [BUY-A, SELL-A, BUY-B, SELL-B]
        entryIndex:
          type: integer
          minimum: 0
        entryTime:
          type: string
          format: date-time
        entryPrice:
          type: number
        positionSize:
          type: number
          exclusiveMinimum: 0
