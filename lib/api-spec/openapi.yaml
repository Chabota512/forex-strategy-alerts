    SimulationSettings:
      type: object
      properties:
        enabled:
          type: boolean
          default: true
        startingBalance:
          type: number
          exclusiveMinimum: 0
          maximum: 1000000000000
          default: 1000
        riskPercent:
          type: number
          exclusiveMinimum: 0
          maximum: 100
          default: 1
          description: Percent of current realized balance risked by each trade.
        sizingMode:
          type: string
          enum: [LOTS, RISK_PERCENT]
          default: RISK_PERCENT
          description: Use fixed lot size or percent-risk position sizing.
        lotSize:
          type: number
          exclusiveMinimum: 0
          maximum: 1000000
          default: 0.01
          description: Fixed lot size used when sizingMode is LOTS.
        rewardMultiple:
          type: number
          exclusiveMinimum: 0
          maximum: 100
          default: 2
        stopBodyWeight:
          type: number
          exclusiveMinimum: 0
          default: 1
          description: Candle-geometry weight applied to the alert-candle body.
        stopWickMultiplier:
          type: number
          exclusiveMinimum: 0
          default: 2
          description: Candle-geometry multiplier applied to the sweep-side wick.
        targetRangeMultiplier:
          type: number
          exclusiveMinimum: 0
          default: 3
          description: Candle-geometry multiplier applied to the alert-candle range.
        exitModel:
          type: string
          enum: [swept_level_atr, candle_geometry]
          default: swept_level_atr
          description: Candle geometry uses the configured body and sweep-wick stop weights and alert-candle range target; rewardMultiple applies only to swept_level_atr.
        geometryWeights:
          anyOf:
            - $ref: "#/components/schemas/GeometryWeights"
            - type: "null"
          description: Active candle-geometry multipliers; null when swept_level_atr is selected.
        directionMode:
          type: string
          enum: [normal, inverted, adaptive]
          default: normal
          description: XAUUSD-only direction handling. Normal preserves the source alert side.
        tradeDirection:
          type: string
          enum: [both, buy_only, sell_only]
          default: both
          description: Limit simulated entries to both sides, buys only, or sells only.
        invertWeights:
          $ref: "#/components/schemas/InvertWeights"
        invertThreshold:
          type: number
          minimum: 0
          maximum: 1
          default: 0.5
          description: Adaptive mode inverts when the normalized score is greater than or equal to this threshold.
        swingVersion:
          type: string
          enum: [V1, V2]
          default: V2
      required: [enabled, startingBalance, riskPercent, sizingMode, lotSize, rewardMultiple, stopBodyWeight, stopWickMultiplier, targetRangeMultiplier, exitModel, geometryWeights, directionMode, tradeDirection, invertWeights, invertThreshold, swingVersion]
    GeometryWeights:
      type: object
      properties:
        bodyWeight:
          type: number
          minimum: 0.5
          maximum: 2
        wickMultiplier:
