openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Forex Strategy Lab read-only data and unscored review operations
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: lab
    description: Real XAUUSD research data and unscored smoke review
  - name: evolve
    description: Owner-gated single-round strategy evolution
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /lab/dataset:
    get:
      operationId: getLabDataset
      tags: [lab]
      summary: Get local dataset metadata and owner review status
      parameters:
        - name: symbol
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/InstrumentSymbol"
            default: XAUUSD
      responses:
        "200":
          description: Dataset details, instrument review status, and review timeframes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatasetInfo"
  /lab/candles:
    get:
      operationId: getLabCandles
      tags: [lab]
      summary: Read a bounded candle window or one monthly chunk
      parameters:
        - name: symbol
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/InstrumentSymbol"
            default: XAUUSD
        - name: timeframe
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/Timeframe"
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100000
            default: 100000
        - name: chunkMonth
          in: query
          required: false
          description: Return only this UTC calendar month while including the full selected-window index metadata.
          schema:
            type: string
            pattern: "^\\d{4}-(0[1-9]|1[0-2])$"
        - name: chunkOffset
          in: query
          required: false
          description: Zero-based local offset within the selected UTC calendar month.
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Candle window, with an explicit truncation indicator
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CandleWindow"
        "400":
          description: Invalid timeframe or date window
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /lab/backtest:
    post:
      operationId: runLabBacktest
      tags: [lab]
      summary: Run an unscored smoke backtest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BacktestInput"
      responses:
        "200":
          description: Candles and informational alerts from the frozen engine
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BacktestResult"
        "400":
          description: Invalid request or empty date window
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: Requested window exceeds the review cap
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /lab/replay/sessions:
    post:
      operationId: startLabReplaySession
      tags: [lab]
      summary: Start a paused incremental replay session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplaySessionStartInput"
      responses:
        "201":
          description: Session initialized at candle zero
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplaySessionStartResult"
        "400":
          description: Invalid or empty replay window
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /lab/replay/sessions/{sessionId}/advance:
    post:
      operationId: advanceLabReplaySession
      tags: [lab]
      summary: Process the next uncached replay candles up to an index
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplayAdvanceInput"
      responses:
        "200":
          description: New alerts, newly calculated states, and cached visible states
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplayAdvanceResult"
        "400":
          description: Invalid replay or visible-window index
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Replay session not found or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /lab/replay/sessions/{sessionId}/manual-decision:
    post:
      operationId: submitLabReplayManualDecision
      tags: [lab]
      summary: Record a take, skip, or finalize decision in manual replay
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplayManualDecisionInput"
      responses:
        "200":
          description: Updated manual decision ledger and simulation snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplayManualDecisionResult"
        "400":
          description: Invalid manual decision or replay state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Replay session not found or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /lab/trades/comment:
    post:
      operationId: getTradeComment
      tags: [lab]
      summary: Generate or retrieve an objective journal comment for a simulated trade
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TradeCommentInput"
      responses:
        "200":
          description: Cached comment, generated comment, or graceful unavailable state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TradeCommentResult"
  /lab/alerts/comment:
    post:
      operationId: getAlertComment
      tags: [lab]
      summary: Generate or retrieve an objective alert journal comment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AlertCommentInput"
      responses:
        "200":
          description: Cached comment, generated comment, or graceful unavailable state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AICommentResult"
  /evolve/run:
    post:
      operationId: runEvolveRound
      tags: [evolve]
      summary: Start one background evolution round
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvolveRunInput"
      responses:
        "202":
          description: Evolution job accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvolveJobStatus"
        "409":
          description: Another evolution job is still running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /evolve/cancel:
    post:
      operationId: cancelEvolveJob
      tags: [evolve]
      summary: Request cancellation of an active evolution round
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvolveCancelInput"
      responses:
        "202":
          description: Cancellation accepted; the job will stop at a safe checkpoint
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvolveJobStatus"
        "400":
          description: Invalid cancellation input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Evolution job not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: The evolution job has already finished
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /evolve/history:
    get:
      operationId: getEvolveHistory
      tags: [evolve]
      summary: List archived evolution round results
      responses:
        "200":
          description: Archived evolution results, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvolveRoundHistory"
  /evolve/policy:
    get:
      operationId: getEvolvePolicy
      tags: [evolve]
      summary: Get the current owner-promoted alert policy
      responses:
        "200":
          description: Current versioned alert policy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvolvePolicy"
  /evolve/system-intelligence:
    get:
      operationId: getSystemIntelligence
      tags: [evolve]
      summary: Read the XAUUSD case-learning dashboard
      responses:
        "200":
          description: Informational case history, seeded beliefs, and bounded tunables
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemIntelligence"
  /evolve/policy/history:
    get:
      operationId: getEvolvePolicyHistory
      tags: [evolve]
      summary: List immutable SYSTEM INTELLIGENCE policy versions
      responses:
        "200":
          description: Policy versions, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvolvePolicyHistory"
  /evolve/policy/restore:
    post:
      operationId: restoreEvolvePolicy
      tags: [evolve]
      summary: Restore a past policy as a new current version
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvolvePolicyRestoreInput"
      responses:
        "200":
          description: Restored policy now pointed to by policy_current.json
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvolvePolicy"
        "404":
          description: The requested policy version does not exist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /evolve/policy/min-si-score:
    post:
      operationId: setEvolvePolicyMinSiScore
      tags: [evolve]
      summary: Set the owner-controlled SYSTEM INTELLIGENCE score threshold
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvolvePolicyMinSiScoreInput"
      responses:
        "200":
          description: New immutable policy version with the requested score threshold
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvolvePolicy"
        "400":
          description: The requested score threshold is invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /evolve/autoevolve/status:
    get:
      operationId: getAutoevolveStatus
      tags: [evolve]
      summary: Read AUTOEVOLVE daemon status and persistent alerts
      responses:
        "200":
          description: Current daemon phase, key state, and latest archive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutoevolveStatus"
  /evolve/autoevolve/start:
    post:
      operationId: startAutoevolve
      tags: [evolve]
      summary: Start the Groq-only XAUUSD daemon
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AutoevolveStartInput"
      responses:
        "202":
          description: AUTOEVOLVE start accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutoevolveStatus"
        "409":
          description: AUTOEVOLVE or another evolution round is already running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /evolve/autoevolve/stop:
    post:
      operationId: stopAutoevolve
      tags: [evolve]
      summary: Stop AUTOEVOLVE after the current safe checkpoint
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AutoevolveStopInput"
      responses:
        "202":
          description: AUTOEVOLVE stop requested
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutoevolveStatus"
  /evolve/status/{job_id}:
    get:
      operationId: getEvolveStatus
      tags: [evolve]
      summary: Poll an evolution job and its live log
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Current job state, logs, and round result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvolveJobStatus"
        "404":
          description: Evolution job not found in this server process
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /evolve/decide:
    post:
      operationId: decideEvolveJob
      tags: [evolve]
      summary: Promote or reject an eligible candidate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvolveDecisionInput"
      responses:
        "202":
          description: Owner decision accepted and round finalization resumed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvolveJobStatus"
        "400":
          description: Invalid decision input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Evolution job not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Job is not awaiting an owner decision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Timeframe:
      type: string
      enum: [M1, M5, M15, H1, H4, D1]
    ReviewTimeframe:
      type: string
      enum: [M5, M15]
    EvolvePolicySettings:
      type: object
      properties:
        min_strength:
          type: string
          enum: [NONE, NEUTRAL, STRONG]
        require_wp_agree:
          type: boolean
        require_engulf:
          type: boolean
        timeframes:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ReviewTimeframe"
        exit_model:
          type: string
          enum: [swept_level_atr, candle_geometry]
        cooldown_candles:
          type: integer
          minimum: 0
          maximum: 48
        min_si_score:
          type: number
          minimum: 0
          maximum: 0.8
        min_si_score_mode:
          type: string
          enum: [auto, override]
        min_si_score_override:
          type: ["number", "null"]
          minimum: 0
          maximum: 0.8
      required:
        - min_strength
        - require_wp_agree
        - require_engulf
        - timeframes
        - exit_model
        - cooldown_candles
        - min_si_score
        - min_si_score_mode
        - min_si_score_override
    EvolvePolicyMinSiScoreEvidence:
      type: object
      properties:
        status:
          type: string
          enum: [calibrating, calibrated]
        caseCount:
          type: integer
          minimum: 0
        totalScoredCases:
          type: integer
          minimum: 0
        requiredCaseCount:
          type: integer
          minimum: 1
        casesNeeded:
          type: integer
          minimum: 0
        windowSize:
          type: integer
          minimum: 1
        minimumRetention:
          type: number
          minimum: 0
          maximum: 1
        gridStep:
          type: number
          minimum: 0
        maxThreshold:
          type: number
          minimum: 0
          maximum: 0.8
        windowStartUtc:
          type: ["string", "null"]
        windowEndUtc:
          type: ["string", "null"]
        threshold:
          type: number
          minimum: 0
          maximum: 0.8
        filteredCaseCount:
          type: integer
          minimum: 0
        retention:
          type: ["number", "null"]
          minimum: 0
          maximum: 1
        baselineExpectancyR:
          type: ["number", "null"]
        filteredExpectancyR:
          type: ["number", "null"]
        message:
          type: string
      required:
        - status
        - caseCount
        - totalScoredCases
        - requiredCaseCount
        - casesNeeded
        - windowSize
        - minimumRetention
        - gridStep
        - maxThreshold
        - windowStartUtc
        - windowEndUtc
        - threshold
        - filteredCaseCount
        - retention
        - baselineExpectancyR
        - filteredExpectancyR
        - message
      additionalProperties: false
    EvolvePolicy:
      type: object
      properties:
        schema_version:
          type: integer
          const: 1
        version:
          type: integer
          minimum: 1
        mode:
          type: string
          enum: [passthrough, active]
        settings:
          $ref: "#/components/schemas/EvolvePolicySettings"
        promoted_at_utc:
          type: ["string", "null"]
        source_champion_version:
          type: ["string", "null"]
        min_si_score_auto:
          type: number
          minimum: 0
          maximum: 0.8
        min_si_score_evidence:
          $ref: "#/components/schemas/EvolvePolicyMinSiScoreEvidence"
      required:
        - schema_version
        - version
        - mode
        - settings
        - promoted_at_utc
        - source_champion_version
    EvolvePolicyRestoreInput:
      type: object
      properties:
        version:
          type: integer
          minimum: 1
      required: [version]
      additionalProperties: false
    EvolvePolicyMinSiScoreInput:
      type: object
      properties:
        min_si_score:
          type: ["number", "null"]
          minimum: 0
          maximum: 0.8
      required: [min_si_score]
      additionalProperties: false
    EvolvePolicyVersion:
      type: object
      properties:
        schema_version:
          type: integer
          const: 1
        version:
          type: integer
          minimum: 1
        mode:
          type: string
          enum: [passthrough, active]
        settings:
          $ref: "#/components/schemas/EvolvePolicySettings"
        promoted_at_utc:
          type: ["string", "null"]
        source_champion_version:
          type: ["string", "null"]
        created_at_utc:
          type: ["string", "null"]
          format: date-time
        restored_from_version:
          type: ["integer", "null"]
        is_current:
          type: boolean
      required:
        - schema_version
        - version
        - mode
        - settings
        - promoted_at_utc
        - source_champion_version
        - created_at_utc
        - restored_from_version
        - is_current
    EvolvePolicyHistory:
      type: object
      properties:
        versions:
          type: array
          items:
            $ref: "#/components/schemas/EvolvePolicyVersion"
      required: [versions]
    AutoevolveKeyState:
      type: string
      enum: [unknown, available, depleted, rate-limited, unavailable]
    AutoevolveAlert:
      type: object
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
        message:
          type: string
        persistent:
          type: boolean
        created_at_utc:
          type: string
          format: date-time
        job_id:
          type: ["string", "null"]
      required: [id, kind, message, persistent, created_at_utc, job_id]
    AutoevolveStatus:
      type: object
      properties:
        state:
          type: string
          enum:
            - stopped
            - running
            - awaiting-owner-approval
            - cooldown
            - paused-keys-depleted
            - stopping
            - failed
        running:
          type: boolean
        phase:
          type: ["string", "null"]
        round:
          type: integer
          minimum: 0
        last_verdict:
          type: ["string", "null"]
        last_result_file:
          type: ["string", "null"]
        active_job_id:
          type: ["string", "null"]
          format: uuid
        swing_version:
          type: string
          enum: [V1, V2]
        cooldown_seconds:
          type: integer
          minimum: 0
        cooldown_until_utc:
          type: ["string", "null"]
          format: date-time
        stop_requested:
          type: boolean
        keys:
          type: object
          properties:
            key1:
              $ref: "#/components/schemas/AutoevolveKeyState"
            key2:
              $ref: "#/components/schemas/AutoevolveKeyState"
          required: [key1, key2]
        alerts:
          type: array
          items:
            $ref: "#/components/schemas/AutoevolveAlert"
        error:
          type: ["string", "null"]
        updated_at_utc:
          type: string
          format: date-time
      required:
        - state
        - running
        - phase
        - round
        - last_verdict
        - last_result_file
        - active_job_id
        - swing_version
        - cooldown_seconds
        - cooldown_until_utc
        - stop_requested
        - keys
        - alerts
        - error
        - updated_at_utc
    AutoevolveStartInput:
      type: object
      properties:
        swingVersion:
          type: string
          enum: [V1, V2]
          default: V2
      additionalProperties: false
    AutoevolveStopInput:
      type: object
      additionalProperties: false
    Candle:
      type: object
      properties:
        time:
          type: string
          format: date-time
        open:
          type: number
        high:
          type: number
        low:
          type: number
        close:
          type: number
        cct:
          type: string
        cst:
          type: string
        cstV1State:
          type: string
        cstV2State:
          type: [string, "null"]
        swingVersionAgreementPct:
          type: [integer, "null"]
          minimum: 0
          maximum: 100
        swingReversal:
          type: boolean
        cctLegacy:
          type: string
        cstLegacy:
          type: string
        legacyAgreementPct:
          type: integer
          minimum: 0
          maximum: 100
        dcState:
          type: string
          enum: [undefined, uptrend, downtrend]
        hierState:
          type: string
          enum: [undefined, uptrend, downtrend, transition]
        wickPressure:
          $ref: "#/components/schemas/WickPressure"
      required: [time, open, high, low, close]
    OwnerAttestedSanityMetrics:
      type: object
      properties:
        provenance:
          type: string
          enum: [owner_reported]
        levelCorrelation:
          type: number
        hourlyChangeCorrelation:
          type: number
        medianFuturesOverSpotOffsetUsd:
          type: number
        note:
          type: string
      required:
        - provenance
        - levelCorrelation
        - hourlyChangeCorrelation
        - medianFuturesOverSpotOffsetUsd
        - note
    InstrumentSymbol:
      type: string
      enum: [XAUUSD, GBPUSD, USDJPY, GBPJPY, AUDJPY]
    DatasetInfo:
      type: object
      properties:
        symbol:
          $ref: "#/components/schemas/InstrumentSymbol"
        source:
          type: string
        sourceSha256:
          type: string
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        candleCount:
          type: integer
        reviewStatus:
          type: string
        ownerApproved:
          type: boolean
        scoringEnabled:
          type: boolean
        simulationCost:
          type: number
        instrumentReviews:
          type: array
          items:
            $ref: "#/components/schemas/InstrumentReviewInfo"
        availableTimeframes:
          type: array
          items:
            $ref: "#/components/schemas/Timeframe"
        defaultReviewTimeframes:
          type: array
          items:
            $ref: "#/components/schemas/ReviewTimeframe"
        m1ReviewNotice:
          type: string
        ownerAttestedSanityMetrics:
          $ref: "#/components/schemas/OwnerAttestedSanityMetrics"
      required:
        - symbol
        - source
        - sourceSha256
        - startDate
        - endDate
        - candleCount
        - reviewStatus
        - ownerApproved
        - scoringEnabled
        - simulationCost
        - instrumentReviews
        - availableTimeframes
        - defaultReviewTimeframes
        - m1ReviewNotice
        - ownerAttestedSanityMetrics
    InstrumentReviewInfo:
      type: object
      properties:
        symbol:
          type: string
        status:
          type: string
        ownerApproved:
          type: boolean
        dataAvailable:
          type: boolean
        dataComplete:
          type: boolean
        requiredYears:
          type: array
          items:
            type: integer
        availableYears:
          type: array
          items:
            type: integer
        rowCount:
          type: integer
